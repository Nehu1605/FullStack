<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Boxes</title>

    <style>
        .container {
            width: 100%;
        }

        .box {
            width: 1500px;
            height: 700px;
            font-weight: 900;
            text-align: center;
            background-image:linear-gradient(to-bottom-left,black,white)

            position: sticky;
            top: 0;

            margin: 0;
            overflow: hidden;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box" id="box1">
            <img src="https://c4.wallpaperflare.com/wallpaper/297/288/1009/5bd320d590bcf-wallpaper-preview.jpg">
        </div>

        <div class="box" id="box2">
            <img src="https://c4.wallpaperflare.com/wallpaper/670/961/282/dubai-skyline-starry-sky-at-night-ultra-hd-wallpapers-for-android-mobile-phones-tablet-and-laptop-1920%C3%971080-wallpaper-preview.jpg">
        </div>

        <div class="box" id="box3">
            <img src="https://cdn.pixabay.com/photo/2018/01/14/23/12/nature-3082832_1280.jpg">
        </div>

        <div class="box" id="box4">
            <img src="https://cdn.wallpapersafari.com/6/38/NnAqbM.png">
        </div>

        <div class="box" id="box5">
            <img src="https://i.pinimg.com/736x/30/d6/66/30d6663362372d4993e335ba9be7963c.jpg">
        </div>

        <div class="box" id="box6">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQKE1idDBM030u6QXhfEb7aIyi9CD0Ko4UYsfDRkCeJbdWD2cpGtGP0pQA&s=10">
        </div>

        <div class="box" id="box7">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3IxfBtWlXBqEZb40DukcwbcqPa6hDeuyyzVVoY7bmeKnyYHy56dwdYv0&s=10">
        </div>

        <div class="box" id="box8">
            <img src="https://cdn.wallpapersafari.com/5/48/2r0KTh.jpg">
        </div>

        <div class="box" id="box9">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQIHHDkt3Cu4HaI32m8-LtiqgvWKMKN72RzGUXcB6l3FA&s">
        </div>

    </div>

</body>
</html>

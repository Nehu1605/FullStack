<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 100px;      
            width: 250px;        
            border: 2px solid;     
            }
    </style>

</head>
<body>
    <img src="https://picsum.photos/200/300?grayscale" alt style="
        padding:4%;
        background-color: black;">
    <img src="https://picsum.photos/200/300?grayscale" alt style="
        margin:4%;
        background-color: rgb(237, 66, 66);">
    <div class="box">
        This is a lot of big content inside a very short box. 
        Because there is too much text to fit inside the height, 
        the browser will automatically create a scrollbar so you 
        can read everything without breaking the layout!
    </div>

        
</body>
</html>

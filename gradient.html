<!DOCTYPE html>
<html>
<head>
    <title>Conic Gradient</title>

    <style>
        body {
            background-color: #d9cece;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box9 {
            width: 300px;
            height: 200px;
            border-radius: 15px;

            background: linear-gradient(
                black,
                silver
            );

            padding: 5px;
            filter:drop-shadow(12px 13px 5px purple);
        }

        .inside {
            width: 100%;
            height: 100%;
            background-color: #222;
            border-radius: 12px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 15px;
            font-size:80px;
            text-align:center;
            background:linear-gradient(#d0c0ff,white);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            font-weight:700;
            text-shadow: 4px 3px 3px purple;
        }
        
    </style>
</head>

<body>

    <div class="box9">
        <div class="inside">
            Hii
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS Product Cards</title>
</head>
<body style="margin: 0; padding: 40px; font-family: Arial, sans-serif; background-color: #f4f7f6;">

    <!-- Section Heading -->
    <h2 style="text-align: center; color: #333; margin-bottom: 30px;">Our Products</h2>

    <!-- 1. Grid Container (Flex Wrapper) -->
    <div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">

        <!-- Product Card 1 -->
        <div style="display: flex; flex-direction: column; width: 280px; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden;">
            <!-- Image Box -->
            <div style="height: 180px; background-color: #ddd;">
                <img src="https://placeholder.com" alt="Product" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <!-- Info Box -->
            <div style="padding: 15px; display: flex; flex-direction: column; flex-grow: 1;">
                <h3 style="margin: 0 0 10px 0; font-size: 18px; color: #333;">Smart Watch</h3>
                <p style="margin: 0 0 15px 0; font-size: 14px; color: #666; line-height: 1.4;">Track your daily steps and health metrics easily.</p>
                <!-- Price and Button pinned to bottom using margin-top: auto -->
                <div style="margin-top: auto;">
                    <div style="font-size: 20px; font-weight: bold; color: #007bff; margin-bottom: 15px;">$149.00</div>
                    <button style="width: 100%; background-color: #007bff; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer;">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Product Card 2 -->
        <div style="display: flex; flex-direction: column; width: 280px; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden;">
            <!-- Image Box -->
            <div style="height: 180px; background-color: #ddd;">
                <img src="https://placeholder.com" alt="Product" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <!-- Info Box -->
            <div style="padding: 15px; display: flex; flex-direction: column; flex-grow: 1;">
                <h3 style="margin: 0 0 10px 0; font-size: 18px; color: #333;">Wireless Earbuds</h3>
                <p style="margin: 0 0 15px 0; font-size: 14px; color: #666; line-height: 1.4;">High-quality sound with active noise cancellation.</p>
                <!-- Price and Button pinned to bottom -->
                <div style="margin-top: auto;">
                    <div style="font-size: 20px; font-weight: bold; color: #007bff; margin-bottom: 15px;">$89.00</div>
                    <button style="width: 100%; background-color: #007bff; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer;">Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Product Card 3 -->
        <div style="display: flex; flex-direction: column; width: 280px; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden;">
            <!-- Image Box -->
            <div style="height: 180px; background-color: #ddd;">
                <img src="https://placeholder.com" alt="Product" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <!-- Info Box -->
            <div style="padding: 15px; display: flex; flex-direction: column; flex-grow: 1;">
                <h3 style="margin: 0 0 10px 0; font-size: 18px; color: #333;">Power Bank</h3>
                <p style="margin: 0 0 15px 0; font-size: 14px; color: #666; line-height: 1.4;">10000mAh fast-charging portable power bank.</p>
                <!-- Price and Button pinned to bottom -->
                <div style="margin-top: auto;">
                    <div style="font-size: 20px; font-weight: bold; color: #007bff; margin-bottom: 15px;">$29.00</div>
                    <button style="width: 100%; background-color: #007bff; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer;">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>

</body>
</html>

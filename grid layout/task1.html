<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <Style>
        /* Reset and Base Styles */
        * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        }

        body {
        padding: 20px;
        background-color: #f4f4f4;
        }

        /* Gallery Container - Mobile First (1 Column) */
        .gallery {
        display: grid;
        grid-template-columns: 1fr;
        gap: 15px; /* Spacing between images */
        max-width: 1200px;
        margin: 0 auto;
        }

        /* Gallery Items & Images */
        .gallery-item {
        overflow: hidden;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Prevents image distortion */
        display: block;
        transition: transform 0.3s ease;
        }

        /* Hover Effect */
        .gallery-item img:hover {
        transform: scale(1.05);
        }

        /* --- Media Queries for Responsiveness --- */

        /* Tablets (600px and up) -> 2 Columns */
        @media (min-width: 600px) {
        .gallery {
            grid-template-columns: repeat(2, 1fr);
        }
        }

        /* Desktops (900px and up) -> 3 Columns */
        @media (min-width: 900px) {
        .gallery {
            grid-template-columns: repeat(3, 1fr);
        }
        }

        </Style>
    </head>
    <body>
        <section class="gallery">
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Beautiful Landscape">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Ocean Waves">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Forest Path">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="City Skyline">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Mountain Peak">
        </div>
        <div class="gallery-item">
            <img src="https://picsum.photos" alt="Desert Dunes">
        </div>
        </section>

    </body>
</html>

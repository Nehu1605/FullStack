<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing:border-box;
        
        }
        .wrapper{

            display:grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-areas: 
            "photo1 photo2 photo3 photo4"
            "photo5 photo6 photo7 photo8"
            "photo9 photo10 photo11 photo12";
        gap:10px;
        max-width:400px;
        margin:20px auto;
        border-color: rgb(188, 22, 22);
        border-width:2px solid black;
        }
        .box:hover{
            transform: scale(1.03);
        }
        .box{
            min-height:100px;
            border:2px solid black;
            box-shadow:10px 5px 5px rgba(0,0,0,0.2);
            background-color: blueviolet;
            display:grid;
            justify-content: center;
            align-items:center;
            font-size:medium;
            color:white;
        }

    </style>
</head>
<body>
    <h1 style="text-align: center;"> photo gallery</h1>
    <div class="wrapper" style="grid-area:main";>
        <div class="box" style="grid-area:photo1">1</div>
        <div class="box" style="grid-area:photo2">2</div>
        <div class="box" style="grid-area:photo3">3</div>
        <div class="box" style="grid-area:photo4">4</div>
        <div class="box" style="grid-area:photo5">5</div>
        <div class="box" style="grid-area:photo6">6</div>
        <div class="box" style="grid-area:photo7">7</div>
        <div class="box" style="grid-area:photo8">8</div>
        <div class="box" style="grid-area:photo9">9</div>
        <div class="box" style="grid-area:photo10">10</div>
        <div class="box" style="grid-area:photo11">11</div>
        <div class="box" style="grid-area:photo12">12</div>
</div>
</body>
</html>

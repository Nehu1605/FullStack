<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            flex-direction:column;
            outline:3px solid black;
            height:90vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-wrap:wrap;
        }
        .container>div{
            color:white;
            width:150px;
            height:120px;
            justify-content:center;
            align-items:center;
        }
        #box1{
            background-color: black;
            flex-basis:150px;
            justify-content:center;
            align-items:center;
            text-align: center;
            flex-grow:2px;
            flex-shrink:20px;
        }
        #box2{
            background-color:green;
            flex-basis: 150px;
            justify-content:center;
            align-items:center;
            text-align: center;   
            flex-grow:1px;
        }
        #box3{
            background-color: blue;
            flex-basis: 150px;
            justify-content:center;
            align-items:center;
            text-align: center;
            flex-grow:1px;
        }
        #box4{
            background-color: rgb(247, 0, 255);
            flex-basis: 150px;
            justify-content:right;
            align-items:right;
            text-align: center;
            flex-grow:1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div  id="box1" >1</div>
        <div  id="box2" >2</div>
        <div  id="box3" >3</div>
        <div  id="box4" >4</div>
    </div>
</body>
</html>
